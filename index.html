<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Weight Unit Converter</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="container">

    <header>
      <h1>Weight Unit Converter</h1>
      <p class="lead">
        Convert between kilograms, grams, milligrams, pounds, ounces and stones.
      </p>
    </header>

    <section class="converter">

      <h2>Convert</h2>

      <div class="row">
        <label for="input-value">Value</label>
        <input id="input-value" type="number" placeholder="e.g. 72.5" />
      </div>

      <div class="row pair">

        <div>
          <label for="from-unit">From</label>
          <select id="from-unit"></select>
        </div>

        <div>
          <label for="to-unit">To</label>
          <select id="to-unit"></select>
        </div>

      </div>

      <div class="row controls">
        <button id="swap-btn">Swap</button>
        <button id="convert-btn">Convert</button>
        <button id="clear-btn" class="ghost">Clear</button>
      </div>

      <div class="row result">
        <label>Result</label>
        <div id="output" class="output">—</div>
        <button id="copy-btn">Copy</button>
      </div>

      <div class="row options">
        <label for="precision">Decimal places</label>
        <input id="precision" type="number" min="0" max="12" value="4" />
      </div>

    </section>

    <section class="history">
      <h2>History (Latest 5)</h2>
      <ol id="history-list"></ol>
      <button id="clear-history" class="ghost small">Clear History</button>
    </section>

    <footer>
      <p class="muted">Built with — grams used as base unit</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
